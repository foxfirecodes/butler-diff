<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Butler Diff</title>
  <desc id="description">Muted purple stacked review cards with a branching Git graph, a coral minus, and a mint plus.</desc>
  <defs>
    <linearGradient id="background" x1="160" y1="96" x2="848" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#563b69"/>
      <stop offset="1" stop-color="#251730"/>
    </linearGradient>
    <linearGradient id="paper" x1="292" y1="300" x2="740" y2="804" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffefa"/>
      <stop offset="1" stop-color="#ece7f3"/>
    </linearGradient>
    <linearGradient id="mint" x1="594" y1="592" x2="686" y2="710" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3bc799"/>
      <stop offset="1" stop-color="#159875"/>
    </linearGradient>
    <linearGradient id="coral" x1="594" y1="372" x2="686" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff897f"/>
      <stop offset="1" stop-color="#eb5e72"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#100817" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="202" fill="url(#background)"/>
  <rect x="65" y="65" width="894" height="894" rx="201" fill="none" stroke="#fff" stroke-opacity=".11" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="292" y="206" width="490" height="518" rx="54" transform="rotate(9 537 465)" fill="#806696" stroke="#fff" stroke-opacity=".16" stroke-width="3"/>
    <rect x="250" y="250" width="536" height="524" rx="56" transform="rotate(4 518 512)" fill="#b7a5cb" stroke="#fff" stroke-opacity=".24" stroke-width="3"/>
    <rect x="214" y="298" width="592" height="510" rx="60" fill="url(#paper)"/>
    <rect x="215.5" y="299.5" width="589" height="507" rx="58.5" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
  </g>

  <g fill="none" stroke="#50415f" stroke-width="25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M378 420V682"/>
    <path d="M378 550C378 483 642 514 642 432"/>
    <path d="M378 550C378 617 642 568 642 650"/>
  </g>
  <g fill="#f5f4f7" stroke="#50415f" stroke-width="19">
    <circle cx="378" cy="420" r="27"/>
    <circle cx="378" cy="682" r="27"/>
  </g>

  <circle cx="642" cy="432" r="65" fill="url(#coral)"/>
  <path d="M614 432H670" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round"/>
  <circle cx="642" cy="650" r="65" fill="url(#mint)"/>
  <path d="M614 650H670M642 622V678" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round"/>
</svg>
